apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: practice-a
spec:
  clusterIP: None
  selector: {app: qdrant}
  ports: [{port: 6333, name: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: practice-a
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant, practice: practice-a}
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant
        ports: [{containerPort: 6333}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        volumeMounts:
        - name: data
          mountPath: /qdrant/storage
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
